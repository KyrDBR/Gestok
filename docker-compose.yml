version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gestok_postgres
    restart: always
    environment:
      POSTGRES_USER: gestok_user
      POSTGRES_PASSWORD: gestok_password
      POSTGRES_DB: gestok_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: gestok_redis
    restart: always
    ports:
      - '6379:6379'

volumes:
  postgres_data: